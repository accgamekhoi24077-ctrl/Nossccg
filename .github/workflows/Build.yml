name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          curl -Lo $HOME/theos/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid
          chmod +x $HOME/theos/bin/ldid
        env:
          THEOS: ${{ runner.home }}/theos

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export SDKVERSION=16.5
          make package
        env:
          THEOS: ${{ runner.home }}/theos

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
